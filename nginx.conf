server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Archivos subidos (fotos de perfil, adjuntos). La API los sirve en /files
  # y devuelve la URL usando el host de la petición, que detrás de este proxy
  # es el de esta misma web: sin esta regla las imágenes darían 404.
  location /files/ {
    proxy_pass http://rhapi:8080/files/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy hacia API .NET
  location /api/ {
    proxy_pass http://rhapi:8080/api/;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
